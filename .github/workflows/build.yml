name: Build SaltLite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库源码
        uses: actions/checkout@v4

      - name: 2. 配置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 自动安装 Android SDK 组件 (Platform 34 & Build-Tools)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0"

      - name: 4. 自动安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. 编译 Debug APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          gradle assembleDebug --stacktrace

      - name: 6. 上传生成的 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: SaltLitePlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
